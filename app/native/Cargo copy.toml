[package]
name = "native"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
smoltcp = { version = "0.11", default-features = false, features = [
    "std", 
    "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp", "socket-icmp"] }
socks5-impl = "0.4" # To handle the SOCKS5 handshake
rust-ini = "0.21.3"
boringtun = "0.6.0"
base64 = "0.22.1"
etherparse = "0.19.0"
managed = "0.8.0"
librqbit = "8.1.1"
