[package]
name = "clutch"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
native = { path = ".." }
librqbit = "9.1.0"
anyhow = "1"
url = "2"
tokio = { version = "1", features = ["net"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
rust-ini = "0.21"
